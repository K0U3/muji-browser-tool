<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renovation Spatial Studio</title><style>body{margin:0;background:#f4f2eb;color:#354943;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{max-width:440px;padding:40px}small{letter-spacing:.16em}h1{font-size:34px;font-weight:500;line-height:1.3}p{line-height:1.8}input,button{box-sizing:border-box;width:100%;padding:14px;border:1px solid #abb7ad;border-radius:6px;font:inherit;margin:6px 0}button{background:#354943;color:white;cursor:pointer}#status{font-size:14px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}</style><main><small>RENOVATION / BROWSER EDITION</small><h1>図面から、<br>暮らしを見渡す。</h1><p>DXFから3Dモデル・ウォークイン・プレゼンテーションを作成します。処理はお使いのブラウザ内で行います。</p><form id="unlock"><label for="password">共有パスワード</label><input id="password" type="password" required autocomplete="current-password"><button id="open">ツールを開く</button></form><p id="status" role="status">ブラウザ試用版 / PC版Chrome・Edge推奨<br>初回は解析エンジンの読み込みに時間がかかります。<br>Blender版と同じ描画品質ではありません。</p></main><script>
(()=>{
const status=document.getElementById('status'),button=document.getElementById('open');
document.getElementById('unlock').onsubmit=async e=>{e.preventDefault();button.disabled=true;try{
 status.textContent='ツールを読み込んでいます…';const r=await fetch('./payload.bin');if(!r.ok)throw Error('load');const all=new Uint8Array(await r.arrayBuffer());
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:all.slice(0,16),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},key,all.slice(28))}catch{throw Error('password')}
 const data=JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
 const urls={},blob=(s,t='text/javascript')=>URL.createObjectURL(new Blob([s],{type:t}));for(const [n,s]of Object.entries(data))urls[n]=blob(s,n.endsWith('.html')?'text/html':n.endsWith('.css')?'text/css':'text/plain');
 const worker=blob('self.FILES='+JSON.stringify(data)+';\n'+data['worker.js']);
 const app=blob(data['app.js']),commands=blob(data['model-commands.js']);
 const config='<script>window.onerror=(m)=>document.body.append(Object.assign(document.createElement("p"),{textContent:String(m)}));window.FILES='+JSON.stringify(data).replace(/</g,'\\u003c')+';window.WORKER_URL='+JSON.stringify(worker)+';<\/script>';
 const html=data['index.html'].replace('<head>',()=>'<head>'+config).replace('<link rel="stylesheet" href="./style.css">',()=>'<style>'+data['style.css']+'</style>').replace('src="./viewer.html"',()=>'srcdoc="'+data['viewer.html'].replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"').replace('<script src="./model-commands.js"></'+ 'script>',()=>'<script>'+data['model-commands.js'].replace(/<\/script/gi,'<\\/script')+'</'+'script>').replace('<script src="./app.js"></'+'script>',()=>'<script>'+data['app.js'].replace(/<\/script/gi,'<\\/script')+'</'+'script>');
 document.getElementById('password').value='';document.open();document.write(html);document.close();
}catch(e){status.textContent=e.message==='password'?'パスワードが違うか、公開データが破損しています。':'読み込みに失敗しました。接続とブラウザを確認して再試行してください。';button.disabled=false}};
})();
</script></html>
